name: AIO AI Quality & Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Automated Security & Platform Verification Suite
        run: npm test

      - name: Run Production Hybrid SSR/SSG Build
        run: npm run build
